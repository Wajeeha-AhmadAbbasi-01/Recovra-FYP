# Dev-only services. Start only with explicit team approval.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recovra
      POSTGRES_PASSWORD: recovra_dev
      POSTGRES_DB: recovra_dev
    ports:
      - "5432:5432"
    volumes:
      - recovra_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovra -d recovra_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  recovra_pg_data: